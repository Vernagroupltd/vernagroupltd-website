<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Outer Circle -->
  <defs>
    <linearGradient id="vGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563eb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="circleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c3aed;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Circle Border -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#circleGradient)" stroke-width="16"/>
  
  <!-- Inner White Circle -->
  <circle cx="100" cy="100" r="80" fill="white"/>
  
  <!-- Left V (Blue) -->
  <polygon points="70,60 85,130 100,130 85,75" fill="url(#vGradient)"/>
  
  <!-- Right V (Purple) -->
  <polygon points="100,130 115,75 130,60 115,130" fill="url(#purpleGradient)"/>
  
  <!-- Top Accent Circle -->
  <circle cx="125" cy="55" r="8" fill="#7c3aed"/>
</svg>